# ==============================================================================
# 羽毛球教学知识库 Skill Manifest
# 遵循《CSIG Skill 管理与发布规范 V1.0》§5.2 字段定义
# ==============================================================================

# --- 必填字段 -------------------------------------------------------------------
name: badminton-knowledge
display_name: 羽毛球教学知识库
version: 1.0.0
description: >-
  羽毛球教学与动作分析知识库：技术动作要点库、常见错误与纠正库、训练计划模板、
  动作分析报告模板、13 张教学图解（关节分解/手部细节/腿部动作/击球三视图）与
  2 个循环演示动画，以及视频抽帧、骨骼检测、图示生成脚本。当需要讲解羽毛球技术、
  诊断动作问题、分析上传的动作视频、制定训练计划或生成动作分析报告时加载本知识库。
author: 王老师
level: personal      # personal | product；先个人级发布，达到条件再申请产品级

# --- 可选字段 -------------------------------------------------------------------
license: ""
data_classification: L2   # 处理用户上传的动作视频/照片（≤L2），禁止 L3/L4

# --- 依赖声明 -------------------------------------------------------------------
dependencies:
  runtime:
    - python>=3.8
  external:
    - ffmpeg                  # extract_frames.py 视频抽帧
    - mediapipe-pose-landmarker  # pose_detect.py 骨骼检测（模型需另下，见 SKILL.md）

# --- 生命周期阶段（CSIG §6.1）----------------------------------------------------
lifecycle: draft        # draft → review → released → maintaining → deprecated → archived
