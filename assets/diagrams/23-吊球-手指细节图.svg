<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>吊球手指细节图解</title>
<desc>四张特写：包切的手指捻动、轻吊与劈吊的手指力度差异、拍面切球角度特写、砍球与包切错误对照。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">吊球 · 手指细节图解</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">标准动作示意（原理简化）· 吊球的差别全在手指那一下「捻」</text>
<rect x="40" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">包切 · 手指捻动</text>
<line x1="250" y1="118" x2="250" y2="230" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="180" y="176" width="22" height="18" rx="7" transform="rotate(-18 191 185)" fill="#FDFCF9" stroke="#444441" stroke-width="2.5"/>
<g fill="#FFFFFF" stroke="#444441" stroke-width="2">
<rect x="164" y="160" width="24" height="8" rx="4" transform="rotate(-18 176 164)"/>
<rect x="170" y="168" width="24" height="8" rx="4" transform="rotate(-18 182 172)"/>
</g>
<line x1="186" y1="180" x2="146" y2="140" stroke="#444441" stroke-width="3"/>
<ellipse cx="140" cy="134" rx="5" ry="10" transform="rotate(-42 140 134)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M134,128 L122,118 L124,130 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="133" cy="129" r="3.5" fill="#D85A30"/>
<path d="M150,146 Q138,158 144,172" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M130,140 Q118,166 122,196" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="80" y="120" font-size="11" fill="#993C1D">捻动方向</text>
<line x1="120" y1="122" x2="140" y2="146" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="258" y="150" font-size="11" fill="#5F5E5A">拇指食指夹拍</text>
<line x1="258" y1="154" x2="204" y2="176" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="258" y="196" font-size="11" fill="#5F5E5A">触球短促</text>
<text x="258" y="212" font-size="11" fill="#5F5E5A">像'摸'一下</text>
<text x="54" y="252" font-size="11" fill="#5F5E5A">包切是手指小幅捻动，不是手腕挥动</text>
<text x="54" y="268" font-size="11" fill="#5F5E5A">动作越小越隐蔽，球越转</text>
<rect x="52" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="296" font-size="11" fill="#993C1D">自检：球过网后明显翻滚</text>
<rect x="346" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">轻吊 vs 劈吊 · 手指力度</text>
<line x1="493" y1="100" x2="493" y2="222" stroke="#E7E2D9" stroke-width="1" stroke-dasharray="4 3"/>
<ellipse cx="430" cy="130" rx="5" ry="9" transform="rotate(-40 430 130)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M424,124 L413,114 L415,126 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="423" cy="125" r="3" fill="#D85A30"/>
<path d="M421,136 Q414,158 418,178" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M440,138 Q434,146 437,156" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="430" y="200" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">轻吊 · 三成力</text>
<text x="430" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">手指「摸」，减速明显</text>
<ellipse cx="566" cy="130" rx="5" ry="9" transform="rotate(-40 566 130)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M560,124 L549,114 L551,126 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="559" cy="125" r="3" fill="#D85A30"/>
<path d="M556,136 Q544,164 548,190" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M576,136 Q566,152 570,168" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="566" y="200" font-size="11" font-weight="500" fill="#993C1D" text-anchor="middle">劈吊 · 七成力</text>
<text x="566" y="216" font-size="11" fill="#993C1D" text-anchor="middle">手指「扣」，不降拍速</text>
<text x="358" y="252" font-size="11" fill="#5F5E5A">同一种包切手法，差别在手指用力和制动</text>
<text x="358" y="268" font-size="11" fill="#5F5E5A">先练轻吊的「摸」，再练劈吊的「扣」</text>
<rect x="358" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="296" font-size="11" fill="#993C1D">自检：两种吊球落点都能指哪打哪</text>
<rect x="40" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="348" r="8" fill="#D85A30"/>
<text x="60" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="74" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">切球角度 · 球托特写</text>
<circle cx="150" cy="440" r="16" fill="#FDFCF9" stroke="#444441" stroke-width="3"/>
<path d="M150,424 L136,392 M150,424 L150,388 M150,424 L164,392" stroke="#B4B2A9" stroke-width="2" fill="none"/>
<text x="150" y="444" font-size="10" fill="#5F5E5A" text-anchor="middle">球托</text>
<line x1="118" y1="428" x2="96" y2="404" stroke="#444441" stroke-width="3"/>
<ellipse cx="92" cy="398" rx="5" ry="9" transform="rotate(-48 92 398)" fill="none" stroke="#444441" stroke-width="2"/>
<circle cx="118" cy="428" r="6" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="66" y="452" font-size="11" fill="#993C1D">切右下底部</text>
<line x1="110" y1="448" x2="120" y2="436" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<path d="M118,440 Q104,462 108,486" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="210" y1="420" x2="246" y2="400" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="216" y="392" font-size="11" fill="#5F5E5A">拍面斜 45° 左右</text>
<text x="216" y="452" font-size="11" fill="#5F5E5A">太正 = 高球</text>
<text x="216" y="470" font-size="11" fill="#5F5E5A">太斜 = 切空</text>
<text x="54" y="516" font-size="11" fill="#5F5E5A">接触点在球托的侧后下方，「包住切」</text>
<text x="54" y="532" font-size="11" fill="#5F5E5A">切到正底部是吊高球，切太薄球不往前走</text>
<rect x="52" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="560" font-size="11" fill="#993C1D">自检：球既往前走、又带翻滚</text>
<rect x="346" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="348" r="8" fill="#D85A30"/>
<text x="366" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="380" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">错误对照 · 砍球</text>
<line x1="493" y1="362" x2="493" y2="494" stroke="#E7E2D9" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="422" cy="372" r="9" fill="#993C1D"/>
<text x="422" y="376" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<line x1="422" y1="396" x2="410" y2="440" stroke="#444441" stroke-width="3"/>
<ellipse cx="408" cy="448" rx="5" ry="9" transform="rotate(8 408 448)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M406,428 L395,417 L397,429 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="405" cy="429" r="3" fill="#D85A30"/>
<path d="M404,458 Q402,478 404,490" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="422" y="500" font-size="11" fill="#993C1D" text-anchor="middle">砍球 · 直往下劈</text>
<circle cx="566" cy="372" r="9" fill="#0F6E56"/>
<text x="566" y="376" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✓</text>
<line x1="566" y1="396" x2="548" y2="434" stroke="#444441" stroke-width="3"/>
<ellipse cx="545" cy="442" rx="5" ry="9" transform="rotate(-35 545 442)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M540,424 L529,413 L531,425 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="539" cy="425" r="3" fill="#D85A30"/>
<path d="M537,436 Q524,462 528,486" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="566" y="500" font-size="11" fill="#0F6E56" text-anchor="middle">包切 · 斜面浅切</text>
<text x="358" y="516" font-size="11" fill="#5F5E5A">砍球：拍面太正、切太深——要么下网要么不转</text>
<text x="358" y="532" font-size="11" fill="#5F5E5A">包切：拍面斜、触球浅——球转、贴网、垂直坠</text>
<rect x="358" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="560" font-size="11" fill="#993C1D">自检：连续 10 球不砍，球球带转</text>
</svg>
