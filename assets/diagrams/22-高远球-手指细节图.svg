<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>高远球手指细节图解</title>
<desc>四张特写：握拍五指分布侧面特写、松紧松的手指状态、内旋瞬间屈指发力、不用上场的手指功课。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">高远球 · 手指细节图解</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">标准动作示意（原理简化）· 细节放大：手指怎么握、什么时候紧</text>
<rect x="40" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">握拍五指分布 · 侧面特写</text>
<rect x="179" y="86" width="16" height="130" rx="7" transform="rotate(28 187 151)" fill="#6B655B" stroke="#444441" stroke-width="1.5"/>
<rect x="160" y="148" width="52" height="58" rx="16" transform="rotate(28 186 177)" fill="#FDFCF9" stroke="#444441" stroke-width="2.5"/>
<g fill="#FFFFFF" stroke="#444441" stroke-width="2">
<rect x="176" y="131" width="30" height="12" rx="6" transform="rotate(28 191 137)"/>
<rect x="183" y="119" width="30" height="12" rx="6" transform="rotate(28 198 125)"/>
<rect x="189" y="107" width="30" height="12" rx="6" transform="rotate(28 204 113)"/>
<rect x="196" y="95" width="28" height="12" rx="6" transform="rotate(28 210 101)"/>
<rect x="156" y="158" width="28" height="13" rx="6.5" transform="rotate(-32 170 164)"/>
</g>
<circle cx="174" cy="186" r="9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="74" y="120" font-size="11" fill="#5F5E5A">食指稍扣下压</text>
<line x1="128" y1="116" x2="196" y2="104" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="242" y="128" font-size="11" fill="#5F5E5A">三指包握留缝</text>
<line x1="248" y1="132" x2="206" y2="140" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="66" y="176" font-size="11" fill="#5F5E5A">拇指贴宽面一侧</text>
<line x1="140" y1="172" x2="158" y2="166" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="212" y="196" font-size="11" fill="#993C1D">掌心空出</text>
<line x1="212" y1="192" x2="184" y2="186" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="54" y="252" font-size="11" fill="#5F5E5A">握在拍柄末端到倒数第二格之间</text>
<text x="54" y="268" font-size="11" fill="#5F5E5A">手指分开留缝，像握手不是抓拳头</text>
<rect x="52" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="296" font-size="11" fill="#993C1D">自检：拍柄是'放'进去的，能轻松抽出</text>
<rect x="346" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">松-紧-松 · 手指状态</text>
<g stroke="#444441" stroke-width="2" fill="#FFFFFF">
<rect x="400" y="128" width="10" height="52" rx="5" fill="#6B655B"/>
<rect x="392" y="136" width="22" height="7" rx="3.5"/>
<rect x="394" y="147" width="22" height="7" rx="3.5"/>
<rect x="396" y="158" width="22" height="7" rx="3.5"/>
<rect x="388" y="126" width="16" height="7" rx="3.5"/>
</g>
<text x="408" y="200" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">松</text>
<text x="408" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">指间有缝</text>
<g stroke="#444441" stroke-width="2" fill="#FFFFFF">
<rect x="488" y="128" width="10" height="52" rx="5" fill="#6B655B"/>
<rect x="482" y="136" width="20" height="6" rx="3" fill="#F0997B" stroke="#993C1D"/>
<rect x="483" y="145" width="20" height="6" rx="3" fill="#F0997B" stroke="#993C1D"/>
<rect x="484" y="154" width="20" height="6" rx="3" fill="#F0997B" stroke="#993C1D"/>
<rect x="480" y="126" width="16" height="7" rx="3.5" fill="#F0997B" stroke="#993C1D"/>
</g>
<text x="496" y="200" font-size="12" font-weight="500" fill="#993C1D" text-anchor="middle">紧</text>
<text x="496" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">屈指扣死一瞬</text>
<g stroke="#444441" stroke-width="2" fill="#FFFFFF">
<rect x="576" y="128" width="10" height="52" rx="5" fill="#6B655B"/>
<rect x="568" y="136" width="22" height="7" rx="3.5"/>
<rect x="570" y="147" width="22" height="7" rx="3.5"/>
<rect x="572" y="158" width="22" height="7" rx="3.5"/>
<rect x="564" y="126" width="16" height="7" rx="3.5"/>
</g>
<text x="584" y="200" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">松</text>
<text x="584" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">立刻放松</text>
<line x1="438" y1="152" x2="470" y2="152" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="519" y1="152" x2="551" y2="152" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="358" y="252" font-size="11" fill="#5F5E5A">紧的瞬间只在触球那一下，约 0.01 秒</text>
<text x="358" y="268" font-size="11" fill="#5F5E5A">早握 = 僵；晚握 = 泄；刚好 = 脆响</text>
<rect x="358" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="296" font-size="11" fill="#993C1D">自检：击球声干脆，握完马上松</text>
<rect x="40" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="348" r="8" fill="#D85A30"/>
<text x="60" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="74" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">内旋瞬间 · 屈指发力</text>
<line x1="290" y1="452" x2="196" y2="430" stroke="#444441" stroke-width="8" stroke-linecap="round"/>
<circle cx="196" cy="430" r="4" fill="#D85A30"/>
<rect x="182" y="420" width="24" height="20" rx="8" fill="#FDFCF9" stroke="#444441" stroke-width="2.5"/>
<g fill="#FFFFFF" stroke="#888780" stroke-width="1.5">
<rect x="160" y="404" width="20" height="7" rx="3.5" transform="rotate(-38 170 407)"/>
<rect x="166" y="410" width="20" height="7" rx="3.5" transform="rotate(-38 176 413)"/>
</g>
<g fill="#F0997B" stroke="#993C1D" stroke-width="1.5">
<rect x="154" y="416" width="18" height="7" rx="3.5" transform="rotate(-52 163 419)"/>
<rect x="160" y="422" width="18" height="7" rx="3.5" transform="rotate(-52 169 425)"/>
</g>
<line x1="186" y1="424" x2="136" y2="392" stroke="#444441" stroke-width="3"/>
<ellipse cx="129" cy="386" rx="5" ry="9" transform="rotate(-48 129 386)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M156,404 Q138,414 144,432" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="92" y="428" font-size="11" fill="#993C1D">屈指</text>
<path d="M120,370 L98,358 L100,370 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="119" cy="371" r="3" fill="#D85A30"/>
<text x="54" y="516" font-size="11" fill="#5F5E5A">内旋带到半程，手指才「扣」上去</text>
<text x="54" y="532" font-size="11" fill="#5F5E5A">顺序：旋 → 扣 → 听响，不是同时抓死</text>
<rect x="52" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="560" font-size="11" fill="#993C1D">自检：慢动作分解做 10 次不别扭</text>
<rect x="346" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="348" r="8" fill="#D85A30"/>
<text x="366" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="380" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">手指功课 · 不用上场</text>
<circle cx="400" cy="408" r="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
<text x="400" y="412" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">1</text>
<text x="424" y="404" font-size="12" font-weight="500" fill="#2C2C2A">抽出测试</text>
<text x="424" y="422" font-size="11" fill="#5F5E5A">握好后同伴能轻松抽出拍 = 握对</text>
<circle cx="400" cy="460" r="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
<text x="400" y="464" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">2</text>
<text x="424" y="456" font-size="12" font-weight="500" fill="#2C2C2A">松紧松徒手</text>
<text x="424" y="474" font-size="11" fill="#5F5E5A">每天 20 次：松握→瞬间扣紧→放松</text>
<circle cx="400" cy="512" r="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
<text x="400" y="516" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">3</text>
<text x="424" y="508" font-size="12" font-weight="500" fill="#2C2C2A">盲转换</text>
<text x="424" y="526" font-size="11" fill="#5F5E5A">不看拍柄正反手转换，2 分钟/天</text>
<rect x="358" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="560" font-size="11" fill="#993C1D">自检：看电视时顺手做，一周见效</text>
</svg>
