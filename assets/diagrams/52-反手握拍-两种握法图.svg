<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="100%" role="img" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title>反手握拍两种握法图</title><desc>宽面握法通用、窄面握法利于斜线与被动球；正反手靠指间捻动快速转换。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="44" font-size="15" font-weight="500" fill="#2C2C2A">反手握拍两种握法图</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A">宽面握法通用、窄面握法利于斜线与被动球；正反手靠指间捻动快速转换。</text>
<rect x="40" y="80" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="100" r="9" fill="#D85A30"/><text x="60" y="100" font-size="11" font-weight="500" fill="#FFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="76" y="104" font-size="13" font-weight="500" fill="#2C2C2A">宽面握法（通用）</text>
<polygon points="161.4,203.0 143.0,221.4 117.0,221.4 98.6,203.0 98.6,177.0 117.0,158.6 143.0,158.6 161.4,177.0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.6"/>
<path d="M128 156 q-26 -6 -18 18 q3 14 20 8" fill="none" stroke="#D85A30" stroke-width="4" stroke-linecap="round"/>
<text x="86" y="150" font-size="11" fill="#D85A30">拇指贴宽面</text>
<path d="M160 172 q22 6 14 30" fill="none" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round"/>
<text x="170" y="216" font-size="10.5" fill="#888780">四指并拢</text>
<text x="214" y="156" font-size="11.5" fill="#5F5E5A">· 拍柄稍外旋，拇指上靠</text>
<text x="214" y="178" font-size="11.5" fill="#5F5E5A">· 四指第二指节</text>
<text x="214" y="194" font-size="11.5" fill="#5F5E5A">  在另一宽面</text>
<text x="214" y="222" font-size="11.5" fill="#5F5E5A">· 反手后场、网前通用</text>
<text x="214" y="250" font-size="11.5" fill="#5F5E5A">· 手心仍空：放得下球头</text>
<rect x="56" y="288" width="262" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/><text x="66" y="305" font-size="11" fill="#993C1D">自检：拇指方向 = 出球方向</text>
<rect x="352" y="80" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="372" cy="100" r="9" fill="#D85A30"/><text x="372" y="100" font-size="11" font-weight="500" fill="#FFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="388" y="104" font-size="13" font-weight="500" fill="#2C2C2A">窄面握法（斜线 / 被动）</text>
<polygon points="473.4,203.0 455.0,221.4 429.0,221.4 410.6,203.0 410.6,177.0 429.0,158.6 455.0,158.6 473.4,177.0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.6"/>
<path d="M446 154 q18 -14 32 -2" fill="none" stroke="#D85A30" stroke-width="4" stroke-linecap="round"/>
<text x="450" y="144" font-size="11" fill="#D85A30">拇指顶窄棱</text>
<path d="M470 178 q22 8 12 32" fill="none" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round"/>
<text x="526" y="156" font-size="11.5" fill="#5F5E5A">· 拍面稍左转，拇指顶在</text>
<text x="526" y="172" font-size="11.5" fill="#5F5E5A">  第一、二棱线之间</text>
<text x="526" y="200" font-size="11.5" fill="#5F5E5A">· 打斜线更顺手</text>
<text x="526" y="228" font-size="11.5" fill="#5F5E5A">· 被动回反手直线高远</text>
<text x="526" y="244" font-size="11.5" fill="#5F5E5A">  不易出边线</text>
<rect x="368" y="288" width="262" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/><text x="378" y="305" font-size="11" fill="#993C1D">自检：被动直线球不再经常出界</text>
<rect x="40" y="344" width="606" height="100" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="368" font-size="13" font-weight="500" fill="#2C2C2A">正反手转换：拍柄在指间「捻」一下</text>
<polygon points="123.9,407.7 115.7,415.9 104.3,415.9 96.1,407.7 96.1,396.3 104.3,388.1 115.7,388.1 123.9,396.3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="110" y="432" font-size="11" fill="#2C2C2A" text-anchor="middle">正手握拍</text>
<polygon points="263.9,407.7 255.7,415.9 244.3,415.9 236.1,407.7 236.1,396.3 244.3,388.1 255.7,388.1 263.9,396.3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="250" y="432" font-size="11" fill="#D85A30" text-anchor="middle">外旋捻动</text>
<polygon points="403.9,407.7 395.7,415.9 384.3,415.9 376.1,407.7 376.1,396.3 384.3,388.1 395.7,388.1 403.9,396.3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="390" y="432" font-size="11" fill="#2C2C2A" text-anchor="middle">反手握拍</text>
<polygon points="543.9,407.7 535.7,415.9 524.3,415.9 516.1,407.7 516.1,396.3 524.3,388.1 535.7,388.1 543.9,396.3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="530" y="432" font-size="11" fill="#D85A30" text-anchor="middle">随时再捻回</text>
<line x1="170" y1="402" x2="194" y2="402" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="310" y1="402" x2="334" y2="402" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="450" y1="402" x2="474" y2="402" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>