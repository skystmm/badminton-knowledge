<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>发球手部细节补充图解（反手小球）</title>
<desc>四张特写：反手小球握拍与持球、横切推送手法、不上挑的手腕对照、反手平快球变化。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">反手发小球 · 手部细节补充</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">双打主用 · 贴网而过是生命线，冒高就是送分</text>
<rect x="40" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">反手握拍与持球</text>
<rect x="120" y="150" width="14" height="70" rx="6" transform="rotate(70 127 185)" fill="#6B655B" stroke="#444441" stroke-width="1.5"/>
<rect x="140" y="162" width="40" height="30" rx="10" transform="rotate(70 160 177)" fill="#FDFCF9" stroke="#444441" stroke-width="2.5"/>
<rect x="128" y="150" width="24" height="10" rx="5" transform="rotate(-20 140 155)" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
<ellipse cx="196" cy="142" rx="5" ry="10" transform="rotate(70 196 142)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M236,132 L247,121 L245,133 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="237" cy="133" r="3" fill="#D85A30"/>
<path d="M238,124 L242,104 M238,124 L232,106" stroke="#B4B2A9" stroke-width="1.5"/>
<text x="84" y="140" font-size="11" fill="#5F5E5A">拇指顶宽面</text>
<line x1="138" y1="144" x2="146" y2="152" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="222" y="106" font-size="11" fill="#5F5E5A">捏 2-3 根羽毛</text>
<line x1="230" y1="110" x2="236" y2="120" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="54" y="252" font-size="11" fill="#5F5E5A">反手握拍横举腰间，拍面在身体左侧腰下</text>
<text x="54" y="268" font-size="11" fill="#5F5E5A">球托朝下对准拍面，举在拍前</text>
<rect x="52" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="296" font-size="11" fill="#993C1D">自检：不看手能摆好这个架式</text>
<rect x="346" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">横切推送 · 贴网而过</text>
<line x1="380" y1="150" x2="610" y2="150" stroke="#888780" stroke-width="2.5"/>
<line x1="380" y1="150" x2="380" y2="180" stroke="#B4B2A9" stroke-width="2"/>
<line x1="610" y1="150" x2="610" y2="180" stroke="#B4B2A9" stroke-width="2"/>
<ellipse cx="450" cy="160" rx="4.5" ry="9" transform="rotate(65 450 160)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M456,152 L467,141 L465,153 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="457" cy="153" r="3" fill="#D85A30"/>
<path d="M462,148 Q510,138 560,142" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="444" y1="166" x2="420" y2="196" stroke="#444441" stroke-width="3"/>
<path d="M428,184 Q448,172 464,166" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="420" y="212" font-size="11" fill="#993C1D">横切推送</text>
<text x="358" y="252" font-size="11" fill="#5F5E5A">前臂带手腕向前横切，动作小而短</text>
<text x="358" y="268" font-size="11" fill="#5F5E5A">弧线略高于网顶，过网即落</text>
<rect x="358" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="296" font-size="11" fill="#993C1D">自检：10 球 ≥8 球贴网落前发球线</text>
<rect x="40" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="348" r="8" fill="#D85A30"/>
<text x="60" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="74" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">不上挑 · 手腕对照</text>
<line x1="187" y1="362" x2="187" y2="494" stroke="#E7E2D9" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="118" cy="372" r="9" fill="#993C1D"/>
<text x="118" y="376" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<line x1="100" y1="440" x2="116" y2="412" stroke="#444441" stroke-width="3"/>
<ellipse cx="119" cy="404" rx="4.5" ry="9" transform="rotate(12 119 404)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M122,396 Q128,376 122,362" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="118" y="470" font-size="11" fill="#993C1D" text-anchor="middle">上挑 · 冒高被扑</text>
<circle cx="256" cy="372" r="9" fill="#0F6E56"/>
<text x="256" y="376" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✓</text>
<line x1="240" y1="440" x2="252" y2="410" stroke="#444441" stroke-width="3"/>
<ellipse cx="254" cy="402" rx="4.5" ry="9" transform="rotate(70 254 402)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M258,394 Q280,390 296,392" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="256" y="470" font-size="11" fill="#0F6E56" text-anchor="middle">平送 · 贴网下落</text>
<text x="54" y="516" font-size="11" fill="#5F5E5A">手腕一上挑，弧线就高，对手一步上来扑死</text>
<text x="54" y="532" font-size="11" fill="#5F5E5A">感觉是「推平」，不是「撩起来」</text>
<rect x="52" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="560" font-size="11" fill="#993C1D">自检：过网最高点不超过网顶一掌</text>
<rect x="346" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="348" r="8" fill="#D85A30"/>
<text x="366" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="380" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">变化 · 反手平快球</text>
<line x1="380" y1="452" x2="620" y2="452" stroke="#888780" stroke-width="2.5"/>
<circle cx="560" cy="420" r="5" fill="#444441"/>
<path d="M552,404 Q556,392 564,388" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="542" y="382" font-size="10" fill="#5F5E5A">对手肩线</text>
<path d="M420,446 Q480,400 556,404" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<circle cx="420" cy="448" r="3.5" fill="#D85A30"/>
<text x="386" y="428" font-size="11" fill="#993C1D">反压爆发</text>
<text x="358" y="516" font-size="11" fill="#5F5E5A">同样的准备动作，突然发力「反压」</text>
<text x="358" y="532" font-size="11" fill="#5F5E5A">球从对方肩上越过，专打抢网凶狠的对手</text>
<rect x="358" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="560" font-size="11" fill="#993C1D">自检：小球和平快球准备动作一致</text>
</svg>
