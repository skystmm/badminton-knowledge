<path d="M586,478 Q545,455 503,434" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<circle cx="495" cy="430" r="5" fill="#993C1D"/>
<circle cx="495" cy="430" r="10" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="508" y="426" font-size="11" font-weight="500" fill="#993C1D">中心</text>
<text x="548" y="460" font-size="11" fill="#5F5E5A">小碎步回动</text>
<text x="358" y="516" font-size="11" fill="#5F5E5A">击球后先回中心，再等下一拍</text>
<text x="358" y="532" font-size="11" fill="#5F5E5A">回动用小碎步调整，不要走大步</text>
<rect x="358" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="560" font-size="11" fill="#993C1D">自检：人到位了再启动，不站着等球</text>
