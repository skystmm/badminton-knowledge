<text x="180" y="488" font-size="11" font-weight="500" fill="#993C1D" text-anchor="middle">伸 · 蹬地</text>
<text x="260" y="488" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">缓冲 · 落地</text>
<text x="54" y="516" font-size="11" fill="#5F5E5A">膝：屈（蓄力）→ 伸（发力）→ 再屈（缓冲）</text>
<text x="54" y="532" font-size="11" fill="#5F5E5A">发力时膝不锁死，落地膝内扣缓冲</text>
