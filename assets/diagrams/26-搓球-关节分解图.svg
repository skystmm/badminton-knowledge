<circle cx="112" cy="124" r="11" fill="#FFFFFF" stroke="#444441" stroke-width="3"/>
<g stroke="#444441" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M112,141 L112,183"/>
<path d="M112,183 L96,208 L88,233 L76,233"/>
<path d="M112,183 L128,208 L136,233 L148,233"/>
<path d="M112,141 L100,158 L94,172"/>
<line x1="94" y1="172" x2="88" y2="188"/>
