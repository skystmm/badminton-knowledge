<path d="M414,145 L430,158 L438,170"/>
</g>
<g fill="#D85A30" stroke="#FFFFFF" stroke-width="1">
<circle cx="412" cy="145" r="3.2"/><circle cx="388" cy="142" r="3.2"/><circle cx="364" cy="140" r="3.2"/><circle cx="430" cy="158" r="3.2"/><circle cx="438" cy="170" r="3.2"/><circle cx="420" cy="186" r="3.2"/><circle cx="396" cy="204" r="3.2"/><circle cx="438" cy="210" r="3.2"/><circle cx="384" cy="230" r="3.2"/><circle cx="448" cy="232" r="3.2"/>
</g>
<circle cx="332" cy="133" r="7" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M333,132 L322,121 L324,133 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="332" cy="133" r="3" fill="#D85A30"/>
<path d="M330,142 Q324,158 327,172" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="356" y="263" font-size="11" fill="#5F5E5A">最后一步弓箭步制动</text>
<text x="356" y="282" font-size="11" fill="#5F5E5A">网顶上方 10-30cm 搓切</text>
<text x="356" y="301" font-size="11" fill="#5F5E5A">拍面 45° 切球托右下底</text>
<rect x="354" y="322" width="121" height="36" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
