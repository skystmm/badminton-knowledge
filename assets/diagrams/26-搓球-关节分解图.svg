</g>
<g fill="#D85A30" stroke="#FFFFFF" stroke-width="1">
<circle cx="258" cy="137" r="3.2"/><circle cx="238" cy="148" r="3.2"/><circle cx="222" cy="158" r="3.2"/><circle cx="274" cy="150" r="3.2"/><circle cx="282" cy="162" r="3.2"/><circle cx="262" cy="181" r="3.2"/><circle cx="244" cy="204" r="3.2"/><circle cx="276" cy="206" r="3.2"/><circle cx="228" cy="228" r="3.2"/><circle cx="284" cy="233" r="3.2"/>
</g>
