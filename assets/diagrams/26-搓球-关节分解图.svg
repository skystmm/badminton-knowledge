<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>搓球四步关节分解图</title>
<desc>侧面视角展示正手搓球四步：启动分腿、交叉上网、弓箭步搓切、蹬地回动。网前小球没有发力链，到位稳了手才能细。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="44" font-size="15" font-weight="500" fill="#2C2C2A">正手搓球 · 四步关节分解</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A">侧面视角 · 右手持拍 · 图左为网</text>
<circle cx="436" cy="40" r="4" fill="#D85A30"/>
<text x="446" y="44" font-size="12" fill="#5F5E5A">关节位置：肩肘腕髋膝踝</text>
