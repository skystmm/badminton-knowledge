<text x="364" y="355" font-size="11" fill="#993C1D">贴网垂直下落</text>
<rect x="493" y="76" width="145" height="296" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="513" cy="98" r="9" fill="#D85A30"/>
<text x="513" y="98" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
