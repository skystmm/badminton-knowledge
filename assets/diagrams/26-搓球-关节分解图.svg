<text x="62" y="341" font-size="11" fill="#993C1D">自检：球出拍时</text>
<text x="62" y="355" font-size="11" fill="#993C1D">我已经在动</text>
<rect x="191" y="76" width="145" height="296" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="211" cy="98" r="9" fill="#D85A30"/>
<text x="211" y="98" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
