<text x="568" y="266" font-size="11" fill="#5F5E5A">回中心</text>
<text x="507" y="282" font-size="11" fill="#5F5E5A">右脚蹬地起身</text>
<text x="507" y="301" font-size="11" fill="#5F5E5A">拍收胸前举起来</text>
<rect x="505" y="322" width="121" height="36" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="515" y="341" font-size="11" fill="#993C1D">自检：击球后 1 秒内</text>
<text x="515" y="355" font-size="11" fill="#993C1D">启动回动</text>
<rect x="40" y="384" width="600" height="64" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="408" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">关键顺序</text>
<polygon points="118,394 169,394 178,405 169,416 118,416 127,405" fill="#D85A30"/>
