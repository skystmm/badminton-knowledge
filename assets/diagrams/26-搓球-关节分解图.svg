<circle cx="75" cy="140" r="3" fill="#D85A30"/>
<text x="62" y="122" font-size="11" fill="#888780">来球</text>
<text x="54" y="263" font-size="11" fill="#5F5E5A">对方触球瞬间小跳分腿</text>
<text x="54" y="282" font-size="11" fill="#5F5E5A">屈膝前脚掌，落地无声</text>
<text x="54" y="301" font-size="11" fill="#5F5E5A">判断方向即刻启动</text>
