<text x="212" y="405" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">站稳</text>
<polygon points="248,394 299,394 308,405 299,416 248,416 257,405" fill="#D85A30"/>
<text x="277" y="405" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">高点</text>
