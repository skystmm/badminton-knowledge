<circle cx="565" cy="141" r="3.2"/><circle cx="552" cy="158" r="3.2"/><circle cx="546" cy="170" r="3.2"/><circle cx="579" cy="154" r="3.2"/><circle cx="586" cy="164" r="3.2"/><circle cx="568" cy="181" r="3.2"/><circle cx="552" cy="206" r="3.2"/><circle cx="582" cy="204" r="3.2"/><circle cx="544" cy="232" r="3.2"/><circle cx="590" cy="226" r="3.2"/>
</g>
