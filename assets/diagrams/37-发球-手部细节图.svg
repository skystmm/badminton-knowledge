<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>发球手部细节图解</title>
<desc>四张特写：三指夹球手法、放球不加旋、手腕屈收发力、先击中球托的部位要求。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">发球 · 手部细节图解</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">标准动作示意（原理简化）· 持球的手和挥拍的手各有一半规矩</text>
<rect x="40" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">夹球手法 · 三指</text>
<circle cx="170" cy="160" r="14" fill="#FDFCF9" stroke="#444441" stroke-width="3"/>
<path d="M170,146 L156,114 M170,146 L170,110 M170,146 L184,114" stroke="#B4B2A9" stroke-width="2" fill="none"/>
<text x="170" y="164" font-size="10" fill="#5F5E5A" text-anchor="middle">球托</text>
<g fill="#FFFFFF" stroke="#444441" stroke-width="2">
<rect x="142" y="132" width="26" height="10" rx="5" transform="rotate(38 155 137)"/>
<rect x="188" y="132" width="26" height="10" rx="5" transform="rotate(-38 201 137)"/>
<rect x="162" y="116" width="26" height="10" rx="5" transform="rotate(-4 175 121)"/>
</g>
<text x="86" y="130" font-size="11" fill="#5F5E5A">拇指</text>
<line x1="110" y1="128" x2="142" y2="134" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="222" y="130" font-size="11" fill="#5F5E5A">食指</text>
<line x1="220" y1="134" x2="204" y2="136" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="120" y="102" font-size="11" fill="#5F5E5A">中指</text>
<line x1="142" y1="104" x2="162" y2="116" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="54" y="252" font-size="11" fill="#5F5E5A">拇食中三指夹住球托上方羽毛，球托朝下</text>
<text x="54" y="268" font-size="11" fill="#5F5E5A">捏羽毛不是捏球托：放得干净不带旋</text>
<rect x="52" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="296" font-size="11" fill="#993C1D">自检：松手后球直线下落不翻跟斗</text>
<rect x="346" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">放球 · 不加旋</text>
<line x1="493" y1="100" x2="493" y2="222" stroke="#E7E2D9" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="436" cy="106" r="9" fill="#0F6E56"/>
<text x="436" y="110" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✓</text>
<line x1="436" y1="128" x2="436" y2="200" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<circle cx="436" cy="124" r="3.5" fill="#D85A30"/>
<text x="436" y="222" font-size="11" fill="#0F6E56" text-anchor="middle">三指同松 · 直落</text>
<circle cx="556" cy="106" r="9" fill="#993C1D"/>
<text x="556" y="110" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<path d="M556,128 Q544,160 552,196" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<circle cx="556" cy="124" r="3.5" fill="#D85A30"/>
<text x="556" y="222" font-size="11" fill="#993C1D" text-anchor="middle">捻一下 · 加旋违例</text>
<text x="358" y="252" font-size="11" fill="#5F5E5A">释放球时不得加旋转（规则）</text>
<text x="358" y="268" font-size="11" fill="#5F5E5A">三指同时松开，球自由落体</text>
<rect x="358" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="296" font-size="11" fill="#993C1D">自检：球落点稳定在身体前下方</text>
<rect x="40" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="348" r="8" fill="#D85A30"/>
<text x="60" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="74" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">手腕屈收发力</text>
<line x1="260" y1="470" x2="180" y2="442" stroke="#444441" stroke-width="7" stroke-linecap="round"/>
<circle cx="180" cy="442" r="4" fill="#D85A30"/>
<rect x="166" y="432" width="24" height="20" rx="8" fill="#FDFCF9" stroke="#444441" stroke-width="2.5"/>
<line x1="172" y1="436" x2="150" y2="420" stroke="#B4B2A9" stroke-width="3" stroke-dasharray="5 4"/>
<ellipse cx="146" cy="416" rx="5" ry="9" transform="rotate(-58 146 416)" fill="none" stroke="#B4B2A9" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="172" y1="438" x2="128" y2="400" stroke="#444441" stroke-width="3"/>
<ellipse cx="122" cy="394" rx="5" ry="9" transform="rotate(-48 122 394)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M160,412 Q144,420 148,436" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="96" y="440" font-size="11" fill="#993C1D">屈收前送</text>
<path d="M118,388 L106,378 L108,390 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="117" cy="389" r="3" fill="#D85A30"/>
<text x="54" y="516" font-size="11" fill="#5F5E5A">击球刹那手腕由后伸快速屈收，向前上方送</text>
<text x="54" y="532" font-size="11" fill="#5F5E5A">大臂带动到位，手腕负责最后那一下</text>
<rect x="52" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="560" font-size="11" fill="#993C1D">自检：球向上走、弧度高</text>
<rect x="346" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="348" r="8" fill="#D85A30"/>
<text x="366" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="380" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">先中球托 · 部位要求</text>
<circle cx="470" cy="430" r="15" fill="#FDFCF9" stroke="#444441" stroke-width="3"/>
<path d="M470,416 L457,388 M470,416 L470,384 M470,416 L483,388" stroke="#B4B2A9" stroke-width="2" fill="none"/>
<line x1="450" y1="446" x2="420" y2="470" stroke="#444441" stroke-width="3"/>
<ellipse cx="415" cy="474" rx="5" ry="9" transform="rotate(40 415 474)" fill="none" stroke="#444441" stroke-width="2"/>
<circle cx="456" cy="442" r="6" fill="none" stroke="#0F6E56" stroke-width="1.8"/>
<text x="490" y="452" font-size="11" font-weight="500" fill="#0F6E56">✓ 拍面先触球托</text>
<circle cx="470" cy="402" r="4" fill="#993C1D"/>
<text x="490" y="398" font-size="11" fill="#993C1D">✗ 打羽毛 = 违例+乱飞</text>
<text x="358" y="516" font-size="11" fill="#5F5E5A">规则：发球必须先击中球托（底部）</text>
<text x="358" y="532" font-size="11" fill="#5F5E5A">打到羽毛的球又慢又飘，还直接丢分</text>
<rect x="358" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="560" font-size="11" fill="#993C1D">自检：听声——清脆为托，闷扑为毛</text>
</svg>
