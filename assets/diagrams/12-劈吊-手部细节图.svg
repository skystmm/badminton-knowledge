<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 626" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>劈吊手部细节图解</title>
<desc>三张特写：劈吊握拍与发力、斜切特写（前臂外旋、斜拍面切球托右后侧、触球前微制动）、直线与斜线的拍面对比。</desc>
