<text x="128" y="332" font-size="11" fill="#5F5E5A">对角贴网</text>
<rect x="352" y="230" width="294" height="138" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="368" y="256" font-size="13" font-weight="500" fill="#2C2C2A">反手扑</text>
<text x="438" y="256" font-size="11" fill="#888780">高点终结</text>
<polygon points="409.9,313.7 401.7,321.9 390.3,321.9 382.1,313.7 382.1,302.3 390.3,294.1 401.7,294.1 409.9,302.3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
