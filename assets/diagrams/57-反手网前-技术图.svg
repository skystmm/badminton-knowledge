<text x="126" y="256" font-size="11" fill="#888780">变对角</text>
<polygon points="97.9,313.7 89.7,321.9 78.3,321.9 70.1,313.7 70.1,302.3 78.3,294.1 89.7,294.1 97.9,302.3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
