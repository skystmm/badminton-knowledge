<text x="128" y="142" font-size="11" fill="#5F5E5A">肘部架起，前臂向上推</text>
<text x="128" y="162" font-size="11" fill="#5F5E5A">拇指顶压，送底线</text>
<text x="128" y="182" font-size="11" fill="#5F5E5A">内挑对角 / 外挑直线</text>
<rect x="352" y="80" width="294" height="138" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
