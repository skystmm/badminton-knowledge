<text x="438" y="106" font-size="11" fill="#888780">贴网做球</text>
<polygon points="409.9,163.7 401.7,171.9 390.3,171.9 382.1,163.7 382.1,152.3 390.3,144.1 401.7,144.1 409.9,152.3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
