<text x="440" y="332" font-size="11" fill="#5F5E5A">不触网/不过网击球</text>
<rect x="40" y="384" width="606" height="60" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="408" font-size="12.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">共同原则：动作幅度比正手更小——「网前到后场只有七米，网前减三分劲」</text>
<text x="56" y="428" font-size="11.5" fill="#993C1D" dominant-baseline="central">力量唯一来源：拇指顶压 + 手指捻动，禁止甩手腕 · 验收：反手挑 10 个 ≥8 个落底线 1m 内</text>
