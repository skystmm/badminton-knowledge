<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>上网步伐图解</title>
<desc>四张特写：左网前两步与三步上网的俯视脚步分解、最后一步弓箭步的正误对照、上网-回中心-再上网组合路线。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">上网步伐 · 分解图解</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">俯视为脚步分解（上方为网）· 以左网前（反手区）为例，右网前同理</text>
<rect x="40" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">两步上网 · 站位靠前</text>
<rect x="76" y="100" width="222" height="140" fill="#FDFCF9" stroke="#D3D1C7" stroke-width="1"/>
<line x1="76" y1="112" x2="298" y2="112" stroke="#888780" stroke-width="3"/>
<text x="292" y="108" font-size="10" fill="#888780" text-anchor="end">网</text>
<ellipse cx="176" cy="206" rx="9" ry="15" transform="rotate(12 176 206)" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<ellipse cx="198" cy="206" rx="9" ry="15" transform="rotate(-12 198 206)" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="176" y="230" font-size="10" fill="#888780" text-anchor="middle">左</text>
<text x="198" y="230" font-size="10" fill="#888780" text-anchor="middle">右</text>
<ellipse cx="152" cy="152" rx="9" ry="15" transform="rotate(25 152 152)" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
<ellipse cx="124" cy="118" rx="9" ry="16" transform="rotate(35 124 118)" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<path d="M202,196 Q160,176 154,164" fill="none" stroke="#444441" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M180,196 Q146,160 132,128" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<circle cx="186" cy="178" r="7" fill="#444441"/>
<text x="186" y="182" font-size="10" fill="#FFF" text-anchor="middle">1</text>
<circle cx="146" cy="148" r="7" fill="#D85A30"/>
<text x="146" y="152" font-size="10" fill="#FFF" text-anchor="middle">2</text>
<text x="54" y="252" font-size="11" fill="#5F5E5A">① 右脚先向来球跨一步 ② 左脚大跨到位</text>
<text x="54" y="268" font-size="11" fill="#5F5E5A">左侧上网最后一步是左脚（反手区）</text>
<rect x="52" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="296" font-size="11" fill="#993C1D">自检：两步到位，拍先伸向球</text>
<rect x="346" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">三步上网 · 站位靠后</text>
<rect x="382" y="100" width="222" height="140" fill="#FDFCF9" stroke="#D3D1C7" stroke-width="1"/>
<line x1="382" y1="112" x2="604" y2="112" stroke="#888780" stroke-width="3"/>
<text x="598" y="108" font-size="10" fill="#888780" text-anchor="end">网</text>
<ellipse cx="482" cy="210" rx="9" ry="15" transform="rotate(12 482 210)" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<ellipse cx="504" cy="210" rx="9" ry="15" transform="rotate(-12 504 210)" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="482" y="234" font-size="10" fill="#888780" text-anchor="middle">左</text>
<text x="504" y="234" font-size="10" fill="#888780" text-anchor="middle">右</text>
<ellipse cx="470" cy="172" rx="9" ry="15" transform="rotate(-5 470 172)" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
<ellipse cx="446" cy="146" rx="9" ry="15" transform="rotate(25 446 146)" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
<ellipse cx="424" cy="118" rx="9" ry="16" transform="rotate(35 424 118)" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<path d="M484,198 Q474,188 472,182" fill="none" stroke="#444441" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M500,196 Q462,168 452,158" fill="none" stroke="#444441" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M466,164 Q440,140 430,128" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<circle cx="478" cy="190" r="7" fill="#444441"/>
<text x="478" y="194" font-size="10" fill="#FFF" text-anchor="middle">1</text>
<circle cx="452" cy="168" r="7" fill="#444441"/>
<text x="452" y="172" font-size="10" fill="#FFF" text-anchor="middle">2</text>
<circle cx="436" cy="142" r="7" fill="#D85A30"/>
<text x="436" y="146" font-size="10" fill="#FFF" text-anchor="middle">3</text>
<text x="358" y="252" font-size="11" fill="#5F5E5A">① 左脚小步启动 ② 右脚前交叉 ③ 左脚大跨</text>
<text x="358" y="268" font-size="11" fill="#5F5E5A">第一步小而快，最后一步大而稳</text>
<rect x="358" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="296" font-size="11" fill="#993C1D">自检：交叉不拌腿，节奏 哒-哒-蹬</text>
<rect x="40" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="348" r="8" fill="#D85A30"/>
<text x="60" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="74" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">最后一步 · 正误对照</text>
<circle cx="100" cy="398" r="9" fill="#993C1D"/>
<text x="100" y="402" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="118" y="394" font-size="11.5" font-weight="500" fill="#993C1D">步幅太小</text>
<text x="118" y="412" font-size="11" fill="#5F5E5A">跨不到位，弯腰够球</text>
<circle cx="100" cy="452" r="9" fill="#993C1D"/>
<text x="100" y="456" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="118" y="448" font-size="11.5" font-weight="500" fill="#993C1D">跨太大收不住</text>
<text x="118" y="466" font-size="11" fill="#5F5E5A">人冲出去，回不来</text>
<circle cx="100" cy="506" r="9" fill="#0F6E56"/>
<text x="100" y="510" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="118" y="502" font-size="11.5" font-weight="500" fill="#0F6E56">大到能稳住</text>
<text x="118" y="520" font-size="11" fill="#5F5E5A">脚跟先着地、膝缓冲、即刻能回动</text>
<path d="M210,420 Q250,400 288,404" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="216" y="446" font-size="11" fill="#5F5E5A">步幅由距离定：</text>
<text x="216" y="464" font-size="11" fill="#5F5E5A">远则大跨，近则小跨</text>
<rect x="52" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="560" font-size="11" fill="#993C1D">自检：到位定住 2 秒，不晃不冲</text>
<rect x="346" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="348" r="8" fill="#D85A30"/>
<text x="366" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="380" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">组合 · 上网-回中-再上网</text>
<rect x="382" y="366" width="222" height="132" fill="#FDFCF9" stroke="#444441" stroke-width="1.5"/>
<line x1="382" y1="374" x2="604" y2="374" stroke="#444441" stroke-width="3"/>
<text x="598" y="370" font-size="10" fill="#888780" text-anchor="end">网</text>
<circle cx="493" cy="450" r="5" fill="#993C1D"/>
<circle cx="493" cy="450" r="10" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="501" y="468" font-size="10.5" fill="#993C1D">中心</text>
<circle cx="420" cy="392" r="4" fill="#D85A30"/>
<circle cx="566" cy="392" r="4" fill="#D85A30"/>
<path d="M486,442 Q450,420 426,400" fill="none" stroke="#444441" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M428,400 Q456,426 486,446" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M500,442 Q536,420 560,400" fill="none" stroke="#444441" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M558,400 Q530,426 500,446" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="358" y="516" font-size="11" fill="#5F5E5A">左网上 → 回中心 → 右网上 → 回中心，循环</text>
<text x="358" y="532" font-size="11" fill="#5F5E5A">每次击球后先回中心，再启动下一拍</text>
<rect x="358" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="560" font-size="11" fill="#993C1D">自检：连续 6 趟不减速、不丢重心</text>
</svg>
