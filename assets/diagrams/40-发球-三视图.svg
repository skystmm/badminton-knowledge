<text x="400" y="114" font-size="11" fill="#5F5E5A">击球瞬间整个球低于 1.15 米（腰侧高度）</text>
<text x="400" y="132" font-size="11" fill="#5F5E5A">击球点在前下方，向前上方发力</text>
<text x="400" y="150" font-size="11" fill="#5F5E5A">球先向上走，顶点在对方后场</text>
