<rect x="230" y="552" width="120" height="30" fill="#F1EFE8" stroke="none"/>
<text x="238" y="572" font-size="10.5" fill="#712B13">高远落点区</text>
<circle cx="150" cy="520" r="5" fill="#D85A30"/>
<text x="104" y="538" font-size="10.5" fill="#2C2C2A">发球站位</text>
<path d="M156,514 Q200,496 240,488" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M156,524 Q200,548 244,562" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="400" y="460" font-size="11" font-weight="500" fill="#2C2C2A">本视图看点</text>
<text x="400" y="478" font-size="11" fill="#5F5E5A">对角发球：发到对方对角发球区</text>
<text x="400" y="496" font-size="11" fill="#5F5E5A">小球：贴网落前发球线附近</text>
<text x="400" y="514" font-size="11" fill="#5F5E5A">高远：又高又深，垂直落底线附近</text>
<rect x="40" y="608" width="600" height="64" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="630" font-size="12.5" font-weight="500" fill="#2C2C2A">发球三红线</text>
<rect x="140" y="616" width="140" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="150" y="634" font-size="11" fill="#993C1D">① 整个球 &lt;1.15m</text>
<rect x="300" y="616" width="140" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="310" y="634" font-size="11" fill="#993C1D">② 动作一气呵成</text>
<rect x="460" y="616" width="150" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="470" y="634" font-size="11" fill="#993C1D">③ 先击中球托</text>
<text x="56" y="662" font-size="11" fill="#5F5E5A">脚不抬不移 · 放球不加旋 · 接发方未准备好不发</text>
</svg>
