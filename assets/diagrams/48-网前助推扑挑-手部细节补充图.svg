<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>网前四技术手部细节补充图</title>
<desc>四组错误对照与规则红线：推球翻腕出界、勾球暴露、扑球大力抡与触网、挑球打毛球。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="44" font-size="15" font-weight="500" fill="#2C2C2A">网前四技术手部细节补充图</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A">触球那一瞬决定成败——四组错误对照</text>

<g>
<rect x="40" y="80" width="294" height="170" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="104" font-size="13" font-weight="500" fill="#2C2C2A">推 · 翻腕 vs 捻拨</text>
<line x1="76" y1="140" x2="130" y2="152" stroke="#C0522E" stroke-width="3"/>
<line x1="76" y1="132" x2="76" y2="148" stroke="#C0522E" stroke-width="2"/>
<path d="M130,152 Q150,176 154,196" fill="none" stroke="#C0522E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="150" y="170" font-size="11" fill="#C0522E">✗ 翻腕「捞」出界</text>
<line x1="226" y1="124" x2="280" y2="130" stroke="#5A7A48" stroke-width="3"/>
<line x1="226" y1="116" x2="226" y2="132" stroke="#5A7A48" stroke-width="2"/>
<path d="M280,130 Q312,138 330,144" fill="none" stroke="#5A7A48" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="212" y="112" font-size="11" fill="#5A7A48">✓ 捻拨「按」平快压底线</text>
<text x="56" y="188" font-size="11" fill="#5F5E5A">雪耻练习：对墙推球（2m 外），</text>
<text x="56" y="204" font-size="11" fill="#5F5E5A">球弹回不高于胸部即可</text>
<rect x="52" y="216" width="270" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="233" font-size="11" fill="#993C1D">自检：球过网顶不高于腰带</text>
</g>

<g>
<rect x="352" y="80" width="294" height="170" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="368" y="104" font-size="13" font-weight="500" fill="#2C2C2A">勾 · 暴露 vs 隐蔽</text>
<line x1="368" y1="118" x2="612" y2="118" stroke="#D3D1C7" stroke-width="1"/>
<text x="368" y="142" font-size="11" fill="#C0522E">✗ 起手前就半转腕，对手提前防对角</text>
<text x="368" y="162" font-size="11" fill="#5A7A48">✓ 同搓球举拍，捻切只在触球一瞬</text>
<text x="368" y="192" font-size="11" fill="#5F5E5A">一致性来自：拍头高度、引拍轨迹、</text>
<text x="368" y="210" font-size="11" fill="#5F5E5A">上身姿态三者与搓球逐帧同步</text>
<rect x="364" y="216" width="270" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="374" y="233" font-size="11" fill="#993C1D">自检：录像开头 0.3 秒分不出搓/勾</text>
</g>

<g>
<rect x="40" y="264" width="294" height="170" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="288" font-size="13" font-weight="500" fill="#2C2C2A">扑 · 大力抡 vs 短促叩</text>
<text x="56" y="312" font-size="11" fill="#C0522E">✗ 大臂抡 → 冲网触网 / 过网击球 / 下网</text>
<text x="56" y="330" font-size="11" fill="#5A7A48">✓ 腕背屈→闪回 + 侧向扫，挥幅小</text>
<rect x="70" y="344" width="110" height="70" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="82" y1="356" x2="168" y2="356" stroke="#B4B2A9" stroke-width="2"/>
<text x="82" y="350" font-size="10" fill="#888780">网带</text>
<path d="M120,340 L140,352" stroke="#C0522E" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="150" y="352" font-size="10" fill="#C0522E">拍过网带=违例</text>
<text x="56" y="422" font-size="11" fill="#993C1D">自检：球须已过网带才可击球</text>
</g>

<g>
<rect x="352" y="264" width="294" height="170" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="368" y="288" font-size="13" font-weight="500" fill="#2C2C2A">挑 · 打毛球 vs 停转再打</text>
<circle cx="404" cy="330" r="7" fill="#888780"/>
<path d="M398,316 A15 15 0 1 1 410,344" fill="none" stroke="#C0522E" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M414,394 L438,386" stroke="#C0522E" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="414" y="354" font-size="11" fill="#C0522E">✗ 球还在转→毛缠拍</text>
<circle cx="560" cy="330" r="7" fill="#888780"/>
<path d="M560,318 L560,314 L556,319 L564,319 Z" fill="#5A7A48"/>
<path d="M560,342 L560,346 L556,341 L564,341 Z" fill="#5A7A48"/>
<text x="574" y="354" font-size="11" fill="#5A7A48">✓ 毛朝下竖直</text>
<text x="574" y="370" font-size="11" fill="#5A7A48">击中球托</text>
<text x="368" y="392" font-size="11" fill="#5F5E5A">强搓太难接时先回一板搓过渡，换停转球再挑。</text>
<rect x="364" y="216" width="0" height="0" fill="none"/>
<text x="368" y="422" font-size="11" fill="#993C1D">自检：连续 10 次击中球托不出怪球</text>
</g>
</svg>
