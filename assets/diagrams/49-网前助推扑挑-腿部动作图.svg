<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>网前四技术腿部动作图</title>
<desc>腿稳=手细。扑=一步跨出最浅；推/勾=标准上网中深；挑=深弓箭步最深。击球后全部蹬地回收，挑后回中场、其余守网。</desc>
<text x="40" y="44" font-size="15" font-weight="500" fill="#2C2C2A">网前四技术腿部动作图</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A">腿稳 = 手细：四项共用上网，加载点分布在「深浅」上</text>

<g>
<rect x="40" y="78" width="640" height="106" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="100" font-size="13" font-weight="500" fill="#2C2C2A">扑 · 一步跨出（最浅最快）</text>
<g stroke="#444441" stroke-width="3" stroke-linecap="round" fill="none">
<path d="M124,120 L124,168"/>
<path d="M124,168 L112,184 L108,192 L100,192"/>
<path d="M124,168 L140,182 L150,190 L160,186"/>
</g>
<line x1="86" y1="194" x2="240" y2="194" stroke="#D3D1C7" stroke-width="1"/>
<text x="240" y="130" font-size="11" fill="#5F5E5A">腿先蹬地、拍同时举起，</text>
<text x="240" y="148" font-size="11" fill="#5F5E5A">很少用交叉步——一到网前就要击球；</text>
<text x="240" y="166" font-size="11" fill="#5F5E5A">平时站位近网是扑球快的隐形前提</text>
</g>

<g>
<rect x="40" y="194" width="640" height="110" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="216" font-size="13" font-weight="500" fill="#2C2C2A">推 / 勾 · 标准上网（中）＋ 挑 · 深弓箭步（最深）</text>
<g stroke="#444441" stroke-width="3" stroke-linecap="round" fill="none">
<path d="M124,234 L124,266"/>
<path d="M124,266 L108,282 L102,292 L94,292"/>
<path d="M124,266 L142,280 L152,292 L162,288"/>
</g>
<line x1="86" y1="294" x2="240" y2="294" stroke="#D3D1C7" stroke-width="1"/>
<text x="250" y="242" font-size="11" fill="#5F5E5A">推/勾：与搓球同款交叉上网，</text>
<text x="250" y="260" font-size="11" fill="#5F5E5A">弓箭步脚跟缓冲，发力只到手腕。</text>
<g stroke="#444441" stroke-width="3" stroke-linecap="round" fill="none">
<path d="M420,234 L420,272"/>
<path d="M420,272 L398,292 L390,316 L380,314"/>
<path d="M420,272 L444,290 L458,310 L468,306"/>
</g>
<line x1="374" y1="326" x2="534" y2="326" stroke="#D3D1C7" stroke-width="1"/>
<text x="500" y="238" font-size="11" fill="#5F5E5A">挑：后腿贴地板、</text>
<text x="500" y="256" font-size="11" fill="#5F5E5A">重心越低转得越动，球够底线</text>

</g>

<rect x="40" y="314" width="640" height="134" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="340" font-size="13" font-weight="500" fill="#2C2C2A">共用的回动：击球 → 右脚蹬地 → 回「网前架拍位」，不是底线中心</text>
<text x="56" y="364" font-size="11" fill="#5F5E5A">· 扑/推后若对方仍被动，继续守网等扑封；</text>
<text x="56" y="382" font-size="11" fill="#5F5E5A">· 挑后必须退回中场准备防守（球权换了方向）；</text>
<text x="56" y="400" font-size="11" fill="#5F5E5A">· 勾后守网（对角处最脆），等对方起高球立刻杀/扑；</text>
<text x="56" y="424" font-size="11" fill="#993C1D">自检：击球后 1 秒内启动回动，拍始终举着</text>
</svg>
