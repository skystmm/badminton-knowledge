<path d="M359,90 Q353,99 357,108" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="356" y="263" font-size="11" fill="#5F5E5A">击球点：右前上方</text>
<text x="356" y="282" font-size="11" fill="#5F5E5A">最高点，小臂内旋</text>
<text x="356" y="301" font-size="11" fill="#5F5E5A">蹬地转体层层发力</text>
<rect x="354" y="322" width="121" height="36" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
