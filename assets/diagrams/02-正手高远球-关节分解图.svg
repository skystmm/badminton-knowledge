<circle cx="75" cy="94" r="3" fill="#D85A30"/>
<text x="62" y="76" font-size="11" fill="#888780">来球</text>
<text x="54" y="263" font-size="11" fill="#5F5E5A">侧身，左脚前右脚后</text>
<text x="54" y="282" font-size="11" fill="#5F5E5A">非持拍手上举指球</text>
<text x="54" y="301" font-size="11" fill="#5F5E5A">膝髋放松重心在后脚</text>
