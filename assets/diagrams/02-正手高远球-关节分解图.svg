<circle cx="410" cy="131" r="3.2"/><circle cx="395" cy="110" r="3.2"/><circle cx="382" cy="97" r="3.2"/><circle cx="419" cy="146" r="3.2"/><circle cx="423" cy="157" r="3.2"/><circle cx="418" cy="181" r="3.2"/><circle cx="403" cy="205" r="3.2"/><circle cx="431" cy="211" r="3.2"/><circle cx="390" cy="233" r="3.2"/><circle cx="437" cy="233" r="3.2"/>
</g>
<circle cx="361" cy="80" r="7" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M361,78 L350,67 L352,78 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="360" cy="79" r="3" fill="#D85A30"/>
