</g>
<line x1="594" y1="224" x2="616" y2="224" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="590" y="212" font-size="11" fill="#5F5E5A">回中心</text>
<text x="507" y="263" font-size="11" fill="#5F5E5A">拍随惯性挥至左侧</text>
<text x="507" y="282" font-size="11" fill="#5F5E5A">不压拍头不加动作</text>
<text x="507" y="301" font-size="11" fill="#5F5E5A">先回中心再等下一拍</text>
<rect x="505" y="322" width="121" height="36" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
