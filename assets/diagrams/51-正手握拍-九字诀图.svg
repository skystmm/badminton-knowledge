<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="100%" role="img" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title>正手握拍九字诀图</title><desc>九字握拍：虎口空、掌心空、三指空；握手式握法与正误对照。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="44" font-size="15" font-weight="500" fill="#2C2C2A">正手握拍九字诀图</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A">九字握拍：虎口空、掌心空、三指空；握手式握法与正误对照。</text>
<rect x="40" y="80" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="125" y="112" font-size="17" font-weight="700" fill="#D85A30" text-anchor="middle">虎口空</text>
<polygon points="149.0,177.9 134.9,192.0 115.1,192.0 101.0,177.9 101.0,158.1 115.1,144.0 134.9,144.0 149.0,158.1" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.6"/>
<path d="M95 138 L117 158 M123 134 L117 158" fill="none" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round"/>
<line x1="106" y1="149" x2="95" y2="140" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="125" y="212" font-size="10.5" fill="#888780" text-anchor="middle">V 口对准棱线</text>
<text x="54" y="246" font-size="11" fill="#5F5E5A">虎口对准内侧棱</text>
<text x="54" y="262" font-size="11" fill="#5F5E5A">棱角成一直线</text>
<text x="54" y="278" font-size="11" fill="#5F5E5A">夹死→手腕锁死</text>
<rect x="255" y="80" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="112" font-size="17" font-weight="700" fill="#D85A30" text-anchor="middle">掌心空</text>
<polygon points="364.0,177.9 349.9,192.0 330.1,192.0 316.0,177.9 316.0,158.1 330.1,144.0 349.9,144.0 364.0,158.1" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.6"/>
<path d="M300 150 Q288 168 300 188" fill="none" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round"/>
<circle cx="380" cy="168" r="7.5" fill="none" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="340" y="212" font-size="10.5" fill="#888780" text-anchor="middle">虚握，不贴掌根</text>
<text x="269" y="246" font-size="11" fill="#5F5E5A">掌心与拍柄之间</text>
<text x="269" y="262" font-size="11" fill="#5F5E5A">能放进一个球头</text>
<text x="269" y="278" font-size="11" fill="#5F5E5A">给手指发力留空间</text>
<rect x="470" y="80" width="170" height="200" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="555" y="112" font-size="17" font-weight="700" fill="#D85A30" text-anchor="middle">三指空</text>
<polygon points="579.0,177.9 564.9,192.0 545.1,192.0 531.0,177.9 531.0,158.1 545.1,144.0 564.9,144.0 579.0,158.1" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.6"/>
<path d="M533 196 Q555 203 577 196" fill="none" stroke="#2C2C2A" stroke-width="2.4" stroke-linecap="round"/>
<path d="M533 203 Q555 210 577 203" fill="none" stroke="#2C2C2A" stroke-width="2.4" stroke-linecap="round"/>
<path d="M533 210 Q555 217 577 210" fill="none" stroke="#2C2C2A" stroke-width="2.4" stroke-linecap="round"/>
<text x="555" y="228" font-size="10.5" fill="#888780" text-anchor="middle">靠拢 ≠ 攥紧</text>
<text x="484" y="246" font-size="11" fill="#5F5E5A">中无名小三指</text>
<text x="484" y="262" font-size="11" fill="#5F5E5A">靠拢握住不攥死</text>
<text x="484" y="278" font-size="11" fill="#5F5E5A">触球瞬间才收紧</text>
<rect x="40" y="294" width="380" height="150" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="318" font-size="13" font-weight="500" fill="#2C2C2A">握法意象：握手式 / 握菜刀</text>
<text x="56" y="342" font-size="11.5" fill="#5F5E5A">· 拍面垂直地面，把拍柄「放」进手里，不是「抓」</text>
<text x="56" y="362" font-size="11.5" fill="#5F5E5A">· 食指稍前伸成钩、略高于拇指，控制方向</text>
<text x="56" y="382" font-size="11.5" fill="#5F5E5A">· 击球前松 → 触球瞬握紧 → 击完即松（松-紧-松）</text>
<rect x="56" y="396" width="348" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/><text x="66" y="413" font-size="11" fill="#993C1D">自检：同伴能轻松把拍子抽走；颠球 20 个不看握拍</text>
<rect x="436" y="294" width="204" height="150" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="452" y="318" font-size="13" font-weight="500" fill="#2C2C2A">错误对照</text>
<text x="452" y="342" font-size="11.5" fill="#C0522E">✗ 拳头攥死：苍蝇拍的根源</text>
<text x="452" y="362" font-size="11.5" fill="#C0522E">✗ 虎口对宽面：手腕发不出力</text>
<text x="452" y="382" font-size="11.5" fill="#5A7A48">✓ 三空到位，手指能捻动</text>
<text x="452" y="408" font-size="10.5" fill="#888780">来源：百度经验六句话、360 文库教学口诀</text>
</svg>