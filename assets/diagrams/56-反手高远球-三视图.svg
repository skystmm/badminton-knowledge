<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="100%" role="img" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title>反手高远球三视图</title><desc>侧视击球点、正视反手侧拍位、俯视直线与斜线深落点。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="44" font-size="15" font-weight="500" fill="#2C2C2A">反手高远球三视图</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A">侧视击球点、正视反手侧拍位、俯视直线与斜线深落点。</text>
<rect x="40" y="80" width="294" height="200" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="104" font-size="13" font-weight="500" fill="#2C2C2A">侧视：点在右肩前上方</text>
<line x1="300" y1="120" x2="300" y2="240" stroke="#D3D1C7" stroke-width="2"/>
<circle cx="170" cy="150" r="10" fill="#FFF" stroke="#444441" stroke-width="2.5"/>
<line x1="170" y1="160" x2="176" y2="210" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<polyline points="170,160 158,140 140,122" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="130" cy="112" rx="4.5" ry="9" transform="rotate(28 130 112)" fill="none" stroke="#444441" stroke-width="2"/>
<polyline points="176,210 166,232 158,246" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<polyline points="176,210 192,230 200,244" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<circle cx="128" cy="110" r="6" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="128" cy="110" r="3" fill="#D85A30"/>
<line x1="56" y1="118" x2="112" y2="118" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3"/>
<text x="56" y="134" font-size="10.5" fill="#D85A30">宁早勿晚：点太后发不出力</text>
<path d="M128 110 Q260 60 298 150" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="246" y="96" font-size="10.5" fill="#888780">高远弧线</text>
<rect x="56" y="244" width="262" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/><text x="66" y="261" font-size="11" fill="#993C1D">点 = 右肩前上方、手臂能伸直</text>
<rect x="352" y="80" width="294" height="200" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="368" y="104" font-size="13" font-weight="500" fill="#2C2C2A">正视：拍在身体左侧（反手侧）</text>
<circle cx="490" cy="140" r="10" fill="#FFF" stroke="#444441" stroke-width="2.5"/>
<line x1="490" y1="150" x2="490" y2="200" stroke="#444441" stroke-width="3"/>
<polyline points="490,152 474,138 464,118" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="456" cy="106" rx="4.5" ry="9" transform="rotate(18 456 106)" fill="none" stroke="#444441" stroke-width="2"/>
<polyline points="490,152 504,140 512,128" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<polyline points="490,200 478,226 474,244" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<polyline points="490,200 502,226 506,244" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<circle cx="454" cy="122" r="6" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="454" cy="122" r="3" fill="#D85A30"/>
<text x="368" y="196" font-size="11" fill="#5F5E5A">肘架起、不夹臂；拍面正对来球，</text>
<text x="368" y="214" font-size="11" fill="#5F5E5A">拇指顶住的方向就是出球方向。</text>
<rect x="368" y="244" width="262" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/><text x="378" y="261" font-size="11" fill="#993C1D">不翻肘、不靠手腕甩</text>
<rect x="40" y="294" width="606" height="150" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="318" font-size="13" font-weight="500" fill="#2C2C2A">俯视：落点要深（页面右侧 = 右手持拍者右侧）</text>
<rect x="110" y="336" width="460" height="80" rx="3" fill="none" stroke="#D3D1C7" stroke-width="1.2"/>
<line x1="340" y1="336" x2="340" y2="416" stroke="#D3D1C7" stroke-width="1"/>
<text x="120" y="408" font-size="10" fill="#888780">对方场（目标）</text>
<circle cx="470" cy="396" r="6" fill="#444441"/>
<text x="452" y="412" font-size="10" fill="#888780">我方反手后场</text>
<circle cx="150" cy="356" r="4" fill="#D85A30"/><text x="160" y="360" font-size="10.5" fill="#D85A30">直线底线</text>
<circle cx="530" cy="356" r="4" fill="#D85A30"/><text x="474" y="360" font-size="10.5" fill="#D85A30">斜线对角</text>
<path d="M470 396 Q320 300 150 350" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<path d="M470 396 Q500 330 530 350" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
</svg>