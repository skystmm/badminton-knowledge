<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>劈吊对比与错误对照</title>
<desc>左图：高远球、轻吊、劈吊三种球路的拍面对比；右图：劈吊常见错误对照与正确做法。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">劈吊 · 对比与错误对照</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">标准动作示意（原理简化）· 分清三种吊球，避开三个坑</text>
<rect x="40" y="62" width="294" height="310" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">三种吊球对比</text>
<line x1="108" y1="142" x2="92" y2="124" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="87" cy="119" rx="5" ry="10" transform="rotate(-40 87 119)" fill="none" stroke="#444441" stroke-width="2"/>
<circle cx="75" cy="113" r="7" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M76,112 L65,101 L67,112 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="75" cy="113" r="3" fill="#D85A30"/>
<circle cx="72" cy="117" r="2.5" fill="#D85A30"/>
<text x="112" y="116" font-size="11" font-weight="500" fill="#2C2C2A">高远球 · 平击托底</text>
<text x="112" y="132" font-size="11" fill="#5F5E5A">全力出击，又高又远</text>
<line x1="108" y1="207" x2="92" y2="189" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="87" cy="184" rx="5" ry="10" transform="rotate(-55 87 184)" fill="none" stroke="#444441" stroke-width="2"/>
<circle cx="75" cy="178" r="7" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M76,177 L65,166 L67,177 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="75" cy="178" r="3" fill="#D85A30"/>
<circle cx="80" cy="182" r="2.5" fill="#D85A30"/>
<text x="112" y="181" font-size="11" font-weight="500" fill="#2C2C2A">轻吊 · 包切贴网</text>
<text x="112" y="197" font-size="11" fill="#5F5E5A">收力减速，落点贴网</text>
<line x1="108" y1="272" x2="92" y2="254" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="87" cy="249" rx="5" ry="10" transform="rotate(-62 87 249)" fill="none" stroke="#444441" stroke-width="2"/>
<circle cx="75" cy="243" r="7" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M76,242 L65,231 L67,242 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="75" cy="243" r="3" fill="#D85A30"/>
<circle cx="80" cy="247" r="2.5" fill="#D85A30"/>
<text x="112" y="246" font-size="11" font-weight="500" fill="#993C1D">劈吊 · 斜切快吊</text>
<text x="112" y="262" font-size="11" fill="#5F5E5A">不降拍速，低弧带旋</text>
<text x="52" y="318" font-size="11" fill="#5F5E5A">同一准备动作，差在击球瞬间</text>
<rect x="52" y="330" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="348" font-size="11" fill="#993C1D">自检：三种球路一眼能分清</text>
<rect x="346" y="62" width="294" height="310" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">常见错误对照</text>
<circle cx="366" cy="110" r="8" fill="#993C1D"/>
<text x="366" y="114" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="382" y="108" font-size="11" font-weight="500" fill="#993C1D">切太深 → 挂网</text>
<text x="382" y="124" font-size="11" fill="#5F5E5A">拍面过斜：立一点，切右后侧</text>
<circle cx="366" cy="158" r="8" fill="#993C1D"/>
<text x="366" y="162" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="382" y="156" font-size="11" font-weight="500" fill="#993C1D">握太紧、击球点靠后 → 又高又远</text>
<text x="382" y="172" font-size="11" fill="#5F5E5A">松握，击球点往前送</text>
<circle cx="366" cy="206" r="8" fill="#993C1D"/>
<text x="366" y="210" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="382" y="204" font-size="11" font-weight="500" fill="#993C1D">动作变形 → 意图暴露</text>
<text x="382" y="220" font-size="11" fill="#5F5E5A">准备动作与杀球保持一致</text>
<circle cx="366" cy="254" r="8" fill="#0F6E56"/>
<text x="366" y="258" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="382" y="252" font-size="11" font-weight="500" fill="#0F6E56">一致性 + 微制动 + 轻切</text>
<text x="382" y="268" font-size="11" fill="#5F5E5A">隐蔽、快速、落点尖</text>
<text x="358" y="302" font-size="11" fill="#5F5E5A">过网太高被扑，太低挂网</text>
<rect x="358" y="316" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="334" font-size="11" fill="#993C1D">自检：先练轻吊过关，再学劈吊</text>
</svg>
