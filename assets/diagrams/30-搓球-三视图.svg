<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 692" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>搓球击球瞬间三视图</title>
<desc>搓球击球瞬间的侧视图、正视图、俯视图：击球点高过网顶、拍面 45 度切球托右下底、球翻滚过网即坠。</desc>
