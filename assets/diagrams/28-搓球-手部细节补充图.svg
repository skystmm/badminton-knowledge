<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>搓球手部细节补充图解</title>
<desc>四张对照：正手搓与反手搓、搓推勾三种出球对比、抡大臂与切太厚错误对照、按对手站位的搓球战术应变。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">搓球 · 手部细节补充</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">标准动作示意（原理简化）· 对照自己动作时以实测为准</text>
<rect x="40" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">正手搓 vs 反手搓</text>
<line x1="187" y1="100" x2="187" y2="222" stroke="#E7E2D9" stroke-width="1" stroke-dasharray="4 3"/>
<ellipse cx="118" cy="130" rx="5" ry="9" transform="rotate(-40 118 130)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M112,124 L101,114 L103,126 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="111" cy="125" r="3" fill="#D85A30"/>
<circle cx="107" cy="129" r="5" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="2 2"/>
<path d="M109,136 Q100,158 104,182" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="118" y="200" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">正手 · 切右下底</text>
<text x="118" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">拇食指捻动</text>
<ellipse cx="256" cy="130" rx="5" ry="9" transform="rotate(40 256 130)" fill="none" stroke="#444441" stroke-width="2"/>
<path d="M262,124 L273,114 L271,126 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="263" cy="125" r="3" fill="#D85A30"/>
<circle cx="267" cy="129" r="5" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="2 2"/>
<path d="M265,136 Q274,158 270,182" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="256" y="200" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">反手 · 切左下底</text>
<text x="256" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">拇指顶宽面</text>
<text x="54" y="252" font-size="11" fill="#5F5E5A">反手搓先换反手握拍：拇指顶宽面、肘微抬</text>
<text x="54" y="268" font-size="11" fill="#5F5E5A">原理相同：拍面 45° 包切球托侧下方</text>
<rect x="52" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="296" font-size="11" fill="#993C1D">自检：正反手搓球都能让球翻滚</text>
<rect x="346" y="62" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">搓 / 推 / 勾 · 三种出球</text>
<line x1="366" y1="150" x2="620" y2="150" stroke="#888780" stroke-width="2.5"/>
<path d="M400,142 Q380,170 386,196" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M480,142 Q500,168 546,182" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M560,142 Q600,150 612,120" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<circle cx="400" cy="140" r="3" fill="#D85A30"/>
<circle cx="480" cy="140" r="3" fill="#D85A30"/>
<circle cx="560" cy="140" r="3" fill="#D85A30"/>
<text x="400" y="212" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">搓 · 翻滚贴网</text>
<text x="500" y="212" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">推 · 平快压底线</text>
<text x="596" y="212" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">勾 · 贴网对角</text>
<text x="358" y="252" font-size="11" fill="#5F5E5A">同一个上网动作，出球由拍面和手指决定</text>
<text x="358" y="268" font-size="11" fill="#5F5E5A">先把搓磨稳，推和勾是同一手感的变化</text>
<rect x="358" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="296" font-size="11" fill="#993C1D">自检：同一引拍能出两种以上球</text>
<rect x="40" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="348" r="8" fill="#D85A30"/>
<text x="60" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="74" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">错误对照 · 两个常见病</text>
<circle cx="100" cy="392" r="9" fill="#993C1D"/>
<text x="100" y="396" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="118" y="388" font-size="11.5" font-weight="500" fill="#993C1D">抡大臂搓</text>
<text x="118" y="406" font-size="11" fill="#5F5E5A">球冒高，被对手一拍打死</text>
<circle cx="100" cy="448" r="9" fill="#993C1D"/>
<text x="100" y="452" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="118" y="444" font-size="11.5" font-weight="500" fill="#993C1D">切太厚/拍面太正</text>
<text x="118" y="462" font-size="11" fill="#5F5E5A">球不转、直飞，变成送高球</text>
<circle cx="100" cy="504" r="9" fill="#0F6E56"/>
<text x="100" y="508" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="118" y="500" font-size="11.5" font-weight="500" fill="#0F6E56">手腕手指小动作</text>
<text x="118" y="518" font-size="11" fill="#5F5E5A">拍面 45° 浅切，球转、贴网、垂直坠</text>
<rect x="52" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="560" font-size="11" fill="#993C1D">自检：搓完球，大臂几乎没动</text>
<rect x="346" y="326" width="294" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="348" r="8" fill="#D85A30"/>
<text x="366" y="348" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="380" y="352" font-size="12.5" font-weight="500" fill="#2C2C2A">看对手站位搓</text>
<line x1="366" y1="440" x2="620" y2="440" stroke="#888780" stroke-width="3"/>
<circle cx="560" cy="420" r="5" fill="#444441"/>
<text x="572" y="424" font-size="10" fill="#5F5E5A">对手远</text>
<path d="M420,432 Q400,390 420,368 Q440,392 452,436" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="392" y="364" font-size="11" fill="#993C1D">搓高一点</text>
<circle cx="480" cy="424" r="5" fill="#444441"/>
<text x="470" y="412" font-size="10" fill="#5F5E5A">对手近</text>
<path d="M540,436 Q528,420 534,408 Q548,420 560,438" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="500" y="396" font-size="11" fill="#993C1D">搓低防扑</text>
<text x="358" y="516" font-size="11" fill="#5F5E5A">对手离网远：搓高些，转速快、垂直下坠</text>
<text x="358" y="532" font-size="11" fill="#5F5E5A">对手已贴网：搓低些，不给扑球高度</text>
<rect x="358" y="542" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="560" font-size="11" fill="#993C1D">自检：搓之前先扫一眼对手站位</text>
</svg>
