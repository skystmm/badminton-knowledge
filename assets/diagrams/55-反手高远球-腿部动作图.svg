<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" role="img" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title>反手高远球腿部动作图</title><desc>反手区交叉步后退、右脚蹬转发力、随挥转体回动。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="44" font-size="15" font-weight="500" fill="#2C2C2A">反手高远球腿部动作图</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A">反手区交叉步后退、右脚蹬转发力、随挥转体回动。</text>
<rect x="40" y="80" width="600" height="180" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="104" font-size="13" font-weight="500" fill="#2C2C2A">交叉步后退（背对网方向）</text>
<ellipse cx="110" cy="180" rx="9" ry="20" transform="rotate(-12 110 180)" fill="none" stroke="#444441" stroke-width="2.5"/>
<line x1="132" y1="176" x2="198" y2="172" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<ellipse cx="220" cy="180" rx="9" ry="20" transform="rotate(10 220 180)" fill="none" stroke="#444441" stroke-width="2.5"/>
<line x1="242" y1="176" x2="308" y2="172" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<ellipse cx="330" cy="180" rx="9" ry="20" transform="rotate(-12 330 180)" fill="none" stroke="#444441" stroke-width="2.5"/>
<line x1="352" y1="176" x2="418" y2="172" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<ellipse cx="440" cy="180" rx="9" ry="20" transform="rotate(10 440 180)" fill="none" stroke="#444441" stroke-width="2.5"/>
<line x1="462" y1="176" x2="528" y2="172" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<ellipse cx="550" cy="180" rx="9" ry="20" transform="rotate(-12 550 180)" fill="none" stroke="#444441" stroke-width="2.5"/>
<text x="110" y="226" font-size="11" fill="#5F5E5A" text-anchor="middle">① 启动转身</text>
<text x="220" y="226" font-size="11" fill="#5F5E5A" text-anchor="middle">② 左脚后插</text>
<text x="330" y="226" font-size="11" fill="#5F5E5A" text-anchor="middle">③ 右脚交叉</text>
<text x="440" y="226" font-size="11" fill="#5F5E5A" text-anchor="middle">④ 到位侧身</text>
<text x="550" y="226" font-size="11" fill="#5F5E5A" text-anchor="middle">⑤ 右肩对网击球</text>
<text x="56" y="250" font-size="11.5" fill="#993C1D">先到位再出手：脚没到位时勉强反手 = 打不远的第二大原因。</text>
<rect x="40" y="274" width="294" height="110" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="298" font-size="13" font-weight="500" fill="#2C2C2A">蹬转发力</text>
<text x="56" y="322" font-size="11.5" fill="#5F5E5A">· 最后一步右脚内侧蹬地，</text>
<text x="56" y="340" font-size="11.5" fill="#5F5E5A">  蹬地→转髋→顶肘力量同源</text>
<text x="56" y="362" font-size="11.5" fill="#5F5E5A">· 落地屈膝缓冲，重心不起伏</text>
<rect x="352" y="274" width="294" height="110" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="368" y="298" font-size="13" font-weight="500" fill="#2C2C2A">击球后回动</text>
<text x="368" y="322" font-size="11.5" fill="#5F5E5A">· 随挥同时转体面对网</text>
<text x="368" y="340" font-size="11.5" fill="#5F5E5A">· 并步回中心准备接下一拍</text>
<text x="368" y="362" font-size="11.5" fill="#5F5E5A">· 反手击球后最怕站原地看</text>
<rect x="40" y="398" width="606" height="26" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/><text x="50" y="415" font-size="11" fill="#993C1D">自检：反手后退全程背向网、击球瞬间右肩对网；击完 1 秒内转体回中</text>
</svg>