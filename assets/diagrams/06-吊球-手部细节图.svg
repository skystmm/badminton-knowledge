<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 342" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<title>吊球手部细节图解</title>
<desc>两张特写：高远球正击与吊球包切的拍面对比；包切手法特写，含切击下抹动作与轻吊劈吊落点。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="32" font-size="15" font-weight="500" fill="#2C2C2A">吊球 · 手部细节图解</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">标准动作示意（原理简化）· 握拍同正手，手法在'包切'</text>
<rect x="40" y="62" width="294" height="260" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="60" cy="84" r="8" fill="#D85A30"/>
<text x="60" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="74" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">拍面对比 · 正击与包切</text>
<line x1="178" y1="92" x2="178" y2="200" stroke="#E7E2D9" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="140" y1="152" x2="128" y2="124" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="124" cy="118" rx="5" ry="10" transform="rotate(-40 124 118)" fill="none" stroke="#444441" stroke-width="2"/>
<circle cx="112" cy="106" r="9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M113,105 L102,94 L104,105 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="112" cy="106" r="4" fill="#D85A30"/>
<text x="110" y="176" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">高球 · 正击球托底部</text>
<text x="110" y="192" font-size="11" fill="#5F5E5A" text-anchor="middle">拍面平，正面撞</text>
<line x1="250" y1="162" x2="240" y2="140" stroke="#444441" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="237" cy="134" rx="5" ry="10" transform="rotate(-70 237 134)" fill="none" stroke="#444441" stroke-width="2"/>
<circle cx="226" cy="124" r="9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M227,123 L216,112 L218,123 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="226" cy="124" r="4" fill="#D85A30"/>
<circle cx="221" cy="129" r="2.5" fill="#D85A30"/>
<text x="226" y="176" font-size="11" font-weight="500" fill="#993C1D" text-anchor="middle">吊球 · 切击托侧后</text>
<text x="226" y="192" font-size="11" fill="#5F5E5A" text-anchor="middle">拍面斜，包住切</text>
<text x="52" y="252" font-size="11" fill="#5F5E5A">同一准备动作，拍面角度决定球路</text>
<text x="52" y="268" font-size="11" fill="#5F5E5A">包切 = 拍面切或抹球托侧后方</text>
<rect x="52" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="62" y="296" font-size="11" fill="#993C1D">自检：吊球拍面更立，击球声更闷</text>
<rect x="346" y="62" width="294" height="260" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="366" cy="84" r="8" fill="#D85A30"/>
<text x="366" y="84" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="380" y="88" font-size="12.5" font-weight="500" fill="#2C2C2A">包切手法 · 轻与劈</text>
<line x1="435" y1="130" x2="425" y2="100" stroke="#444441" stroke-width="3.5" stroke-linecap="round"/>
<ellipse cx="422" cy="94" rx="5" ry="10" transform="rotate(-70 422 94)" fill="none" stroke="#444441" stroke-width="2"/>
<rect x="430" y="130" width="10" height="70" rx="5" fill="#6B655B" stroke="#444441" stroke-width="1.5"/>
<rect x="444" y="138" width="24" height="44" rx="12" fill="#FDFCF9" stroke="#444441" stroke-width="2.5"/>
<g fill="#FFFFFF" stroke="#888780" stroke-width="2">
<rect x="418" y="142" width="28" height="8" rx="4"/>
<rect x="418" y="152" width="28" height="8" rx="4"/>
<rect x="418" y="162" width="28" height="8" rx="4"/>
<rect x="418" y="172" width="28" height="8" rx="4"/>
<rect x="436" y="134" width="18" height="8" rx="4"/>
</g>
<circle cx="412" cy="88" r="9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M413,87 L402,76 L404,87 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="412" cy="88" r="4" fill="#D85A30"/>
<line x1="416" y1="102" x2="404" y2="86" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="358" y="116" font-size="11" font-weight="500" fill="#993C1D">拍面包住球头</text>
<line x1="400" y1="120" x2="416" y2="104" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="358" y="152" font-size="11" fill="#5F5E5A">切击或下抹</text>
<line x1="400" y1="148" x2="406" y2="106" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="358" y="252" font-size="11" fill="#5F5E5A">包切是'摸'不是'打'，发力轻</text>
<text x="358" y="268" font-size="11" fill="#5F5E5A">轻吊近网，劈吊两腰</text>
<rect x="358" y="278" width="270" height="28" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="368" y="296" font-size="11" fill="#993C1D">自检：球贴网而过，落至前发球线附近</text>
</svg>
